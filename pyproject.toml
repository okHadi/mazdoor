[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazdoor"
version = "0.1.0"
description = "Local-first job search MVP: collect, curate, research, score, generate resumes and outreach drafts. No auto-send, no apply."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdf>=4.0", "pypdfium2>=4.0", "numpy>=1.26"]

[project.scripts]
mazdoor = "mazdoor.cli:main"

[tool.setuptools.packages.find]
include = ["mazdoor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
